name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Tests run against real Postgres, matching production. See docker-compose.yml.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: containerswap
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: containerswap
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U containerswap"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      CS_DATABASE_URL: postgresql+psycopg://containerswap:localdev@localhost:5433/containerswap

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
