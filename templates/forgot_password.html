{% extends "base.html" %}
{% block title %}{{ t('auth.forgot_title') }} · {{ settings.site_name }}{% endblock %}

{% block content %}
<h1 class="page-title">{{ t('auth.forgot_title') }}</h1>

{% if sent %}
<p>{{ t('auth.forgot_sent_body') }}</p>
{% else %}
<form class="form" method="post" action="/forgot-password">
  <label class="field">
    <span>{{ t('auth.email') }}</span>
    <input type="email" name="email" required autocomplete="email" autocapitalize="none"
           spellcheck="false">
  </label>
  <button class="button button-primary button-block" type="submit">{{ t('auth.forgot_cta') }}</button>
</form>
{% endif %}

<p class="hint center"><a href="/login">{{ t('auth.login_cta') }}</a></p>
{% endblock %}
