[project]
name = "containerswap"
version = "0.1.0"
description = "ContainerSwap — a peer-to-peer marketplace for swapping used food containers that would otherwise be wasted."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi[standard]>=0.118.0",
    "sqlalchemy>=2.0.36",
    "pillow>=11.0.0",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# B008: Depends(...) in defaults is how FastAPI declares dependencies.
# S101: pytest asserts.
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
